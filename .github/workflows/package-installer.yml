name: Package installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/build.mjs
      - run: cd dist && zip -r neon-work.zip neon-work
      - run: gh release upload "${{ inputs.tag }}" dist/neon-work.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
